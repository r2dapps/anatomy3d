    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Human Anatomy 3D",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires WebGL2",
        "isAccessibleForFree": true,
        "description": "Interactive full-body 3D human anatomy explorer featuring 2,234 BodyParts3D meshes across 15 systems, Solid PBR and Radiographic X-Ray shaders, real-time X/Y/Z anatomical section cuts, guided clinical tours, and interactive identification quizzes.",

          "2,234 full-body 3D anatomical structures across 15 systems",
          "Solid PBR and Radiographic X-Ray WebGL shaders",
          "Real-time Sagittal (X), Axial (Y), and Coronal (Z) section cuts",
          "One-click peel hide and instant unhide dissection workflow",
          "Guided specialty study tours and 3D identification quizzes for Cardiology, Pulmonology, Orthopedics, Physiotherapy, and Dentistry",
          "Adaptive mobile, tablet, and low-end WebGL performance budgets"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }

    <!-- Dynamic Canonical URL for SPA Hosting -->
    <script>
      (function () {
        try {
          var url = window.location.origin + window.location.pathname;
          var link = document.createElement('link');
          link.rel = 'canonical';
          link.href = url;
          document.head.appendChild(link);
          var og = document.createElement('meta');
          og.setAttribute('property', 'og:url');
          og.content = url;
          document.head.appendChild(og);
        } catch (_) {}
      })();
    </script>
