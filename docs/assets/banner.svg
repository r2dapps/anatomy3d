  <text x="56" y="168" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Human Anatomy 3D</text>
  <text x="56" y="204" fill="#a8c5db" font-family="system-ui, -apple-system, sans-serif" font-size="17">GPU-batched PBR &amp; Radiographic X-Ray shaders, real-time X/Y/Z section cuts,</text>
  <text x="56" y="229" fill="#a8c5db" font-family="system-ui, -apple-system, sans-serif" font-size="17">1-click peel dissection, and interactive clinical Study Labs built for desktop, mobile &amp; WebXR.</text>

