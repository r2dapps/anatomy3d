    <path d="M130 66V214" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M92 98C104 88 117 85 130 85C143 85 156 88 168 98" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>
