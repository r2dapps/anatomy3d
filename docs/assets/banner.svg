    <path d="M112 0V340M224 0V340M336 0V340M448 0V340M560 0V340M672 0V340M784 0V340M896 0V340M1008 0V340"/>
  </g>
  <rect x="0" y="336" width="1120" height="4" fill="url(#lineGlow)"/>

  <!-- Left Editorial Identity -->
  <g transform="translate(56 58)">
    <rect width="48" height="48" rx="12" fill="#13293e" stroke="#38bdf8" stroke-opacity="0.45"/>
    <ellipse cx="24" cy="26" rx="13" ry="5" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="24" cy="12" r="3.6" fill="#f8fafc"/>
