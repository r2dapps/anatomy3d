<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" fill="none">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09131d"/>
      <stop offset="58%" stop-color="#112233"/>
      <stop offset="100%" stop-color="#0a1826"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="340" rx="20" fill="url(#hbg)"/>
  <!-- Clinical measurement grid -->
  <g stroke="#7bc4e8" stroke-opacity="0.07" stroke-width="1">
