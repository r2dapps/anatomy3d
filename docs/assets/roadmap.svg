<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" fill="none">
  <rect width="1060" height="220" rx="16" fill="#0d1824"/>
  <rect x="0.5" y="0.5" width="1059" height="219" rx="15.5" stroke="#7bc4e8" stroke-opacity="0.2"/>
  <text x="32" y="38" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.8">DEVELOPMENT ROADMAP · DESKTOP TO META QUEST 2 WEBXR</text>

  <line x1="80" y1="90" x2="980" y2="90" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Phase 1 -->
  <circle cx="170" cy="90" r="10" fill="#0f766e" stroke="#5eead4" stroke-width="2.5"/>
