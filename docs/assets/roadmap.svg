    <text x="16" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Core Full-Body WebGL Engine</text>
    <text x="16" y="65" fill="#9cc1da" font-family="system-ui, sans-serif" font-size="11.5">2,234 meshes · Solid/X-Ray · X/Y/Z Cuts · Peel</text>
  </g>

  <!-- Phase 2 -->
  <circle cx="530" cy="90" r="10" fill="#0284c7" stroke="#7dd3fc" stroke-width="2.5"/>
